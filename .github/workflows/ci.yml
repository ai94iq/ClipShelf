name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Test
        run: .\test.bat --no-pause

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      # Xvfb gives the X11 tests a real server (XFixes, XTEST); libsecret-1-0 lets the keyring
      # binding load (no Secret Service runs, so it reports no keyring).
      - name: Install test dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libsecret-1-0

      # Job logs need a signed-in reader; an annotation is public, so failures are echoed as one.
      - name: Test
        run: |
          xvfb-run -a ./test.sh > test.log 2>&1 && exit 0
          tail -5 test.log
          # The failed tests, or the end of the log when the run died before reporting any.
          { grep -E -A8 '^failed' test.log || tail -40 test.log; } | head -80 > failures.txt
          details=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' failures.txt)
          echo "::error title=Test failures::$details"
          exit 1
